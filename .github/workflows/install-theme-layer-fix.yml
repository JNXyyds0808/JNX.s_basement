name: Install theme layer fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add theme fix script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="theme-layer-fix.js?v=1"></script>'
          if tag not in s:
              marker='<script src="homepage-layout.js?v=2"></script>'
              if marker not in s:
                  raise SystemExit('homepage-layout script marker not found')
              s=s.replace(marker, marker+'\n  '+tag, 1)
              p.write_text(s)
          PY
      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Load theme layer fix on homepage'
          git push
