name: Attach private unread module

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Attach private unread loader
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('mentions.js')
          s = p.read_text()
          marker = '/* JNX_PRIVATE_UNREAD_LOADER */'

          if marker not in s:
              patch = r'''

/* JNX_PRIVATE_UNREAD_LOADER */
(function () {
  function loadPrivateUnread() {
    if (document.getElementById('jnxPrivateUnreadScript')) return;
    const script = document.createElement('script');
    script.id = 'jnxPrivateUnreadScript';
    script.src = 'private-unread.js?v=1';
    script.defer = true;
    document.head.appendChild(script);
  }

  function addLoginNotice() {
    if (document.getElementById('jnxChatLoginNotice')) return;

    const buttons = document.querySelector('.buttons');
    if (!buttons) return;

    const notice = document.createElement('p');
    notice.id = 'jnxChatLoginNotice';
    notice.style.cssText = 'margin-top:14px;color:#888;font-size:13px;';
    notice.textContent = '登录后才可查看聊天';
    buttons.insertAdjacentElement('afterend', notice);

    const supabaseLib = window.supabase;
    if (!supabaseLib?.createClient) return;

    const db = supabaseLib.createClient(
      'https://qdehfgjifhtczkrpuadl.supabase.co',
      'sb_publishable_ChrvUYG2OES6q2kCpkBJcA_uaAmfOVp'
    );

    async function update() {
      const { data } = await db.auth.getUser();
      notice.style.display = data?.user ? 'none' : 'block';
    }

    update();
    db.auth.onAuthStateChange(() => update());
  }

  function init() {
    loadPrivateUnread();
    addLoginNotice();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init, { once: true });
  } else {
    init();
  }
})();
'''
              p.write_text(s + patch)

          PY

      - name: Validate
        run: |
          grep -q 'JNX_PRIVATE_UNREAD_LOADER' mentions.js
          grep -q 'private-unread.js' mentions.js
          test -f private-unread.js

      - name: Commit and remove workflow
        run: |
          rm .github/workflows/attach-private-unread.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mentions.js .github/workflows/attach-private-unread.yml
          git commit -m "Attach private unread notifications"
          git push
