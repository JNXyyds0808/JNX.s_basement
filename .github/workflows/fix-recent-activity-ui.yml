name: Fix Recent Activity UI

on:
  push:
    branches:
      - fix/recent-activity-ui

permissions:
  contents: write

jobs:
  patch-ui:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Recent Activity
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ---------- CSS ----------
          css = Path('style.css')
          text = css.read_text(encoding='utf-8')
          if '/* JNX RECENT ACTIVITY UI V3 */' not in text:
              text += r'''

/* JNX RECENT ACTIVITY UI V3 */
.activity-card { padding: 22px 0; border-bottom: 1px solid rgba(255,255,255,.08); }
.activity-card h3 { color: #fff; font-size: 22px; margin-bottom: 9px; }
.activity-card p { color: #aaa; font-size: 16px; line-height: 1.7; }
.activity-card small { display:block; margin-top:10px; color:#666; font-size:12px; }
.view-all-updates-button { margin-top:24px; padding:11px 18px; border:1px solid rgba(255,255,255,.14); border-radius:24px; background:rgba(255,255,255,.04); color:#fff; cursor:pointer; font-size:14px; transition:.25s ease; backdrop-filter:blur(10px); }
.view-all-updates-button:hover { background:rgba(255,255,255,.10); border-color:rgba(255,255,255,.25); transform:translateY(-2px); }
.all-updates-modal { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; opacity:0; visibility:hidden; transition:.25s ease; z-index:200; }
.all-updates-modal.active { opacity:1; visibility:visible; }
.all-updates-overlay { position:absolute; inset:0; background:rgba(0,0,0,.70); backdrop-filter:blur(8px); }
.all-updates-box { position:relative; z-index:2; width:min(720px,90%); max-height:80vh; overflow-y:auto; padding:34px; border:1px solid rgba(255,255,255,.12); border-radius:24px; background:rgba(18,16,30,.95); backdrop-filter:blur(25px); box-shadow:0 25px 70px rgba(0,0,0,.50); }
.all-updates-close { position:absolute; top:14px; right:18px; border:none; background:transparent; color:#888; font-size:28px; cursor:pointer; }
.all-updates-close:hover { color:#fff; }
.all-updates-title { color:#fff; font-size:32px; margin-bottom:8px; }
.all-updates-subtitle { color:#888; margin-bottom:20px; }
.all-update-card { padding:20px 0; border-top:1px solid rgba(255,255,255,.08); }
.all-update-card h3 { color:#fff; margin-bottom:8px; }
.all-update-card p { color:#aaa; line-height:1.7; }
.all-update-card small { display:block; margin-top:10px; color:#666; }
@media (max-width:600px) { .all-updates-box { width:92%; padding:28px 22px; } .all-updates-title { font-size:26px; } }
'''
              css.write_text(text, encoding='utf-8')

          # ---------- JS ----------
          js = Path('script.js')
          text = js.read_text(encoding='utf-8')

          start_marker = '  /* =====================================================\n     RECENT ACTIVITY\n     LOAD\n  ===================================================== */'
          end_marker = '  /* =====================================================\n     ADMIN EDIT BUTTON\n  ===================================================== */'

          start = text.index(start_marker)
          end = text.index(end_marker, start)

          replacement = r'''  /* =====================================================
     RECENT ACTIVITY
     LOAD
  ===================================================== */

  let allSiteUpdates = [];

  const viewAllUpdatesButton =
    document.createElement("button");

  viewAllUpdatesButton.className =
    "view-all-updates-button";

  viewAllUpdatesButton.textContent =
    language === "zh" ? "查看更多" : "View all updates";

  viewAllUpdatesButton.style.display = "none";

  if (activityList && activityList.parentNode) {
    activityList.parentNode.insertBefore(
      viewAllUpdatesButton,
      adminEditButton || null
    );
  }

  const allUpdatesModal =
    document.createElement("div");

  allUpdatesModal.className = "all-updates-modal";
  allUpdatesModal.id = "allUpdatesModal";

  allUpdatesModal.innerHTML = `
    <div class="all-updates-overlay" id="allUpdatesOverlay"></div>
    <div class="all-updates-box">
      <button class="all-updates-close" id="allUpdatesClose">×</button>
      <h2 class="all-updates-title">${language === "zh" ? "所有动态" : "All Updates"}</h2>
      <p class="all-updates-subtitle">${language === "zh" ? "这里保存着 JNX 的所有动态记录。" : "All saved JNX updates."}</p>
      <div id="allUpdatesList"></div>
    </div>
  `;

  document.body.appendChild(allUpdatesModal);

  const allUpdatesList =
    document.getElementById("allUpdatesList");

  function openAllUpdates() {
    allUpdatesModal.classList.add("active");
    allUpdatesList.innerHTML = "";

    allSiteUpdates.forEach(function (item) {
      const card = document.createElement("article");
      card.className = "all-update-card";

      const title = document.createElement("h3");
      title.textContent = item.title || "";

      const content = document.createElement("p");
      content.textContent = item.content || "";

      const date = document.createElement("small");
      if (item.updated_at) {
        const dateObject = new Date(item.updated_at);
        date.textContent =
          language === "zh"
            ? "更新于 " + dateObject.toLocaleString("zh-CN")
            : "Updated " + dateObject.toLocaleString("en-US");
      }

      card.appendChild(title);
      card.appendChild(content);
      card.appendChild(date);
      allUpdatesList.appendChild(card);
    });
  }

  function closeAllUpdates() {
    allUpdatesModal.classList.remove("active");
  }

  viewAllUpdatesButton.addEventListener("click", openAllUpdates);
  document.getElementById("allUpdatesClose")
    ?.addEventListener("click", closeAllUpdates);
  document.getElementById("allUpdatesOverlay")
    ?.addEventListener("click", closeAllUpdates);

  async function loadSiteUpdates() {

    if (!activityList) {
      return;
    }

    if (activityLoading) {
      activityLoading.style.display = "block";
    }

    const result =
      await db
        .from("site_updates")
        .select("id, title, content, created_at, updated_at")
        .order("updated_at", { ascending: false })
        .limit(100);

    if (activityLoading) {
      activityLoading.style.display = "none";
    }

    if (result.error) {
      console.error("Site updates error:", result.error);
      activityList.innerHTML = "";
      const errorElement = document.createElement("p");
      errorElement.textContent =
        language === "zh"
          ? "最近记录暂时无法加载。"
          : "Recent updates could not be loaded.";
      activityList.appendChild(errorElement);
      viewAllUpdatesButton.style.display = "none";
      return;
    }

    allSiteUpdates = result.data || [];
    currentActivity = allSiteUpdates[0] || null;
    activityList.innerHTML = "";

    if (allSiteUpdates.length === 0) {
      const empty = document.createElement("p");
      empty.textContent =
        language === "zh" ? "暂时还没有动态。" : "No updates yet.";
      activityList.appendChild(empty);
      viewAllUpdatesButton.style.display = "none";
      return;
    }

    allSiteUpdates.slice(0, 3).forEach(function (item) {
      const card = document.createElement("article");
      card.className = "activity-card";

      const title = document.createElement("h3");
      title.textContent = item.title || "";

      const content = document.createElement("p");
      content.textContent = item.content || "";

      const date = document.createElement("small");
      if (item.updated_at) {
        const dateObject = new Date(item.updated_at);
        date.textContent =
          language === "zh"
            ? "更新于 " + dateObject.toLocaleString("zh-CN")
            : "Updated " + dateObject.toLocaleString("en-US");
      }

      card.appendChild(title);
      card.appendChild(content);
      card.appendChild(date);
      activityList.appendChild(card);
    });

    viewAllUpdatesButton.textContent =
      language === "zh" ? "查看更多" : "View all updates";

    viewAllUpdatesButton.style.display =
      allSiteUpdates.length > 3 ? "inline-flex" : "none";
  }


'''

          text = text[:start] + replacement + text[end:]
          js.write_text(text, encoding='utf-8')
          PY

      - name: Commit UI changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css script.js
          if git diff --cached --quiet; then
            echo "No UI changes needed."
          else
            git commit -m "Implement recent activity history UI"
            git push
          fi

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-recent-activity-ui.yml
          git commit -m "Remove temporary UI patch workflow"
          git push
