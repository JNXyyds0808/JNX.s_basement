name: Run recent activity UI fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Patch existing three website files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # ---------- script.js ----------
          p = Path('script.js')
          s = p.read_text()

          start = s.find('  async function loadSiteUpdates() {')
          end = s.find('  /* =====================================================\n     ADMIN EDIT BUTTON', start)
          if start == -1 or end == -1:
              raise SystemExit('Could not locate loadSiteUpdates in script.js')

          fn = r'''  async function loadSiteUpdates() {

    if (!activityList) {
      return;
    }

    if (activityLoading) {
      activityLoading.style.display = "block";
    }

    const result = await db
      .from("site_updates")
      .select("id, title, content, updated_at")
      .order("updated_at", { ascending: false })
      .limit(50);

    if (activityLoading) {
      activityLoading.style.display = "none";
    }

    if (result.error) {
      console.error("Site updates error:", result.error);
      activityList.innerHTML = "";

      const errorElement = document.createElement("p");
      errorElement.textContent = language === "zh"
        ? "动态暂时无法加载。"
        : "Updates could not be loaded.";

      activityList.appendChild(errorElement);
      currentActivity = null;
      return;
    }

    activityList.innerHTML = "";

    const updates = result.data || [];

    if (updates.length === 0) {
      const empty = document.createElement("p");
      empty.textContent = language === "zh"
        ? "暂时还没有动态。"
        : "No updates yet.";
      activityList.appendChild(empty);
      currentActivity = null;
      return;
    }

    currentActivity = updates[0];

    updates.slice(0, 3).forEach(function (item) {
      const card = document.createElement("article");
      card.className = "activity-card";

      const title = document.createElement("h3");
      title.textContent = item.title || "";

      const content = document.createElement("p");
      content.textContent = item.content || "";

      const date = document.createElement("small");
      if (item.updated_at) {
        const dateObject = new Date(item.updated_at);
        date.textContent = language === "zh"
          ? "更新于 " + dateObject.toLocaleString("zh-CN")
          : "Updated " + dateObject.toLocaleString("en-US");
      }

      card.appendChild(title);
      card.appendChild(content);
      card.appendChild(date);
      activityList.appendChild(card);
    });

    if (updates.length > 3) {
      const moreButton = document.createElement("button");
      moreButton.className = "activity-more-button";
      moreButton.textContent = language === "zh"
        ? "查看更多  →"
        : "View all updates  →";

      moreButton.addEventListener("click", function () {
        openAllUpdatesModal(updates);
      });

      activityList.appendChild(moreButton);
    }

  }


'''

          s = s[:start] + fn + s[end:]

          marker = '  /* =====================================================\n     ADMIN EDIT BUTTON'
          if 'function openAllUpdatesModal(' not in s:
              modal_js = r'''  /* =====================================================
     ALL UPDATES MODAL
  ====================================================== */

  const allUpdatesModal = document.getElementById("allUpdatesModal");
  const allUpdatesOverlay = document.getElementById("allUpdatesOverlay");
  const allUpdatesClose = document.getElementById("allUpdatesClose");
  const allUpdatesList = document.getElementById("allUpdatesList");

  function closeAllUpdatesModal() {
    allUpdatesModal?.classList.remove("active");
  }

  function openAllUpdatesModal(updates) {
    if (!allUpdatesModal || !allUpdatesList) {
      return;
    }

    allUpdatesList.innerHTML = "";

    (updates || []).forEach(function (item) {
      const card = document.createElement("article");
      card.className = "all-update-card";

      const title = document.createElement("h3");
      title.textContent = item.title || "";

      const content = document.createElement("p");
      content.textContent = item.content || "";

      const date = document.createElement("small");
      if (item.updated_at) {
        const dateObject = new Date(item.updated_at);
        date.textContent = language === "zh"
          ? "更新于 " + dateObject.toLocaleString("zh-CN")
          : "Updated " + dateObject.toLocaleString("en-US");
      }

      card.appendChild(title);
      card.appendChild(content);
      card.appendChild(date);
      allUpdatesList.appendChild(card);
    });

    allUpdatesModal.classList.add("active");
  }

  allUpdatesClose?.addEventListener("click", closeAllUpdatesModal);
  allUpdatesOverlay?.addEventListener("click", closeAllUpdatesModal);


'''
              s = s.replace(marker, modal_js + marker, 1)

          p.write_text(s)

          # ---------- index.html ----------
          p = Path('index.html')
          h = p.read_text()

          if 'id="allUpdatesModal"' not in h:
              modal_html = '''

  <!-- =====================================================
       ALL UPDATES MODAL
  ====================================================== -->

  <div class="all-updates-modal" id="allUpdatesModal">
    <div class="all-updates-overlay" id="allUpdatesOverlay"></div>

    <div class="all-updates-box">
      <button class="all-updates-close" id="allUpdatesClose">×</button>

      <h2 class="all-updates-title" data-en="All Updates" data-zh="全部动态">
        全部动态
      </h2>

      <p class="all-updates-subtitle" data-en="Your previous JNX updates." data-zh="这里保存 JNX 之前发布的所有动态。">
        这里保存 JNX 之前发布的所有动态。
      </p>

      <div id="allUpdatesList"></div>
    </div>
  </div>
'''
              h = h.replace('\n  <script src="script.js"></script>', modal_html + '\n\n  <script src="script.js"></script>', 1)
              p.write_text(h)

          # ---------- style.css ----------
          p = Path('style.css')
          c = p.read_text()

          if '/* Recent Activity UI */' not in c:
              c += r'''

/* =========================================
   Recent Activity UI
========================================= */

.activity-card h3 {
  color: #ffffff;
}

.activity-card p {
  color: #aaa;
}

.activity-card small {
  display: block;
  margin-top: 10px;
  color: #666;
}

.activity-more-button {
  margin-top: 22px;
  padding: 11px 18px;
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: 22px;
  background: rgba(255,255,255,0.04);
  color: #fff;
  cursor: pointer;
  font-size: 14px;
  transition: 0.25s;
  backdrop-filter: blur(10px);
}

.activity-more-button:hover {
  background: rgba(255,255,255,0.1);
  transform: translateY(-2px);
}

.all-updates-modal {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  visibility: hidden;
  transition: 0.25s;
  z-index: 200;
}

.all-updates-modal.active {
  opacity: 1;
  visibility: visible;
}

.all-updates-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(8px);
}

.all-updates-box {
  position: relative;
  z-index: 2;
  width: min(720px, 90%);
  max-height: 80vh;
  overflow-y: auto;
  padding: 32px;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 24px;
  background: rgba(18,16,30,0.94);
  backdrop-filter: blur(25px);
  box-shadow: 0 25px 70px rgba(0,0,0,0.5);
}

.all-updates-close {
  position: absolute;
  top: 16px;
  right: 18px;
  border: none;
  background: transparent;
  color: #888;
  font-size: 28px;
  cursor: pointer;
}

.all-updates-title {
  color: #fff;
  margin-bottom: 8px;
}

.all-updates-subtitle {
  color: #888;
  margin-bottom: 22px;
}

.all-update-card {
  padding: 18px 0;
  border-top: 1px solid rgba(255,255,255,0.08);
}

.all-update-card h3 {
  color: #fff;
  margin-bottom: 8px;
}

.all-update-card p {
  color: #aaa;
  line-height: 1.7;
}

.all-update-card small {
  display: block;
  margin-top: 10px;
  color: #666;
}

@media (max-width: 700px) {
  .all-updates-box {
    width: calc(100% - 28px);
    padding: 25px 20px;
    max-height: 84vh;
    border-radius: 20px;
  }
}
'''
              p.write_text(c)
          PY

      - name: Validate
        run: |
          grep -q 'updates.slice(0, 3)' script.js
          grep -q 'function openAllUpdatesModal' script.js
          grep -q 'id="allUpdatesModal"' index.html
          grep -q 'activity-more-button' style.css

      - name: Commit changes and remove temporary workflow
        run: |
          rm .github/workflows/patch-activity-ui.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html script.js style.css .github/workflows/patch-activity-ui.yml
          git commit -m "Fix recent activity history UI"
          git push