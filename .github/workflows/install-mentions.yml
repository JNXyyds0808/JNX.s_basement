name: Install mentions script

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    if: github.event.head_commit.message != 'Install mentions script tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add mentions.js to index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '  <script src="mentions.js"></script>\n'
          if 'src="mentions.js"' not in text:
              text = text.replace('</body>', tag + '</body>')
              p.write_text(text, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Install mentions script tag"
          git push
